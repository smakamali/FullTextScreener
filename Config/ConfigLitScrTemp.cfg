[general]
appVersion = 0.9.1
# Whether to index documents in `inputDir` before launching the chatbot UI
forceReindex = False
# Whether to log INFO and WARNING messages
enableLogging = True
# Whether to show low level progress bars, if set to False, only high level progress bar will be rendered. Only shown in the terminal.
showProgress = True
# Resume: skip papers that already have a complete result in <outputDir>/individual/<paper>.json made with
# the same questionnaire. Partial results (<paper>.partial.json: interrupted, or with failed questions) are redone.
# Default: False.
skip_existing = False

[llm-model]
# The service to use for LLM generation. Supported services: huggingface, mistral, openrouter
service = huggingface
# The LLM used by the chatbot components
# LLM generation parameters
# max number of tokens to generate in one round
max_new_tokens = 1024
# temperature for sampling from the LLM model (0.0 = greedy sampling, 1.0 = random sampling)
temperature = 0.0
 # whether to sample from the LLM model
do_sample = False

[huggingface]
api_key = *****************
# model_name = mistralai/Mistral-7B-Instruct-v0.3
model_name = Qwen/Qwen2.5-14B-Instruct-1M
# model_name = meta-llama/Llama-3.1-8B-Instruct
# embed_model = BAAI/bge-small-en-v1.5
# model_name = google/gemma-3-12b-it
# model_name = google/gemma-2-9b-it
# embedDim = 384
embed_model = Alibaba-NLP/gte-multilingual-base
embedDim = 768

[openrouter]
api_key = ******************
# OpenRouter model ids look like <provider>/<model>; see https://openrouter.ai/models
model_name = mistralai/mistral-large-2512
embed_model = Alibaba-NLP/gte-Qwen2-1.5B-instruct
embedDim = 1536
# Optional: fixed context window in tokens. If not set, it is read from OpenRouter's model listing.
# If that lookup fails, the run stops with an error rather than falling back to llama-index's
# 3,900-token default, which would truncate the retrieved context.
# context_window = 262144
# Optional: run the embedding model on the GPU. Default (unset): CPU at full precision (fp32).
#   embed_device = cpu (default) | cuda | auto  (auto = GPU only if PyTorch sees one; falls back to CPU on failure)
#   embed_quantization = none (default) | fp16 | 8bit | 4bit  (GPU only; 7B embedding models need 8bit or 4bit on a 16 GB card)
#   Requires a CUDA build of PyTorch. Lower precision slightly changes embeddings and can change which chunks are retrieved.
# embed_device = cuda
# embed_quantization = 8bit
# Optional: maximum token length of a text passed to the embedding model (default: embedDim).
# embed_max_length = 8192


[mistral]
api_key = *****************
model_name = mistral-large-latest
# embed_model = mistral-embed
# embedDim = 1024
embed_model = Alibaba-NLP/gte-multilingual-base
embedDim = 768

[neo4j]
username = neo4j
password = neo4j_rag_poc 
url1 = bolt://localhost:7687
url2 = http://localhost:7474
containerName = neo4j-apoc

[dir-structure]
inputDir = ./input/selected
input_pdf_folder = ./input/pdfs
metadataFile = ./input/metadata.csv
outputDir = ./output
outputFile = ./output/output.json
# JSON file with the screening questions. If this key is missing, Questionnaires/questions_v1.json is used.
questions_file_path = ./Questionnaires/questions_v2.1.json
logDir = ./logs/
logFile = processing_log.txt
dataPath = ../neo4j_vol1/data
pluginsPath = ../neo4j_vol1/plugins

[agent]
# True: one ReAct agent per paper answers all questions, with memory of the paper's earlier questions and answers.
# False: stateless; each question goes straight to the query engine, with no memory between questions.
enable_agent = True
# number of reasoning steps the agent may take per question, if enable_agent is set to True.
# When it is reached, the agent writes a final answer from what it has gathered.
max_iterations = 10
# Max tokens of question/answer history kept in the per-paper agent memory (enable_agent = True).
# Capped automatically so that memory, prompt and reply fit in the model's context window.
memory_token_limit = 100000


[retriever]
# Default retriever parameters
vectorTopK = 10
cutoffScore = 0.5

[nodeparser]
# Node parser approach, can be either `static` or `semantic`
nodeParserType = static
# Number of documents to process at a time, larger values may lead to hitting the embedding API rate limit
batchSize = 1
# Number of tokens to include in each chunk
chunk_size = 1000
# The overlap between subsequent chunks
chunk_overlap = 50

# The following are applicable only to the Semantic Splitter
# Default = 1, Adjust buffer size as needed
bufferSize = 1
# Default = 95, lower values result in too many small chunks
breakpointPercentileThreshold = 95
